/* ============ MMQR Generator ============ */
function crc16ccitt(bytes){
  let crc = 0xFFFF;
  for(let i = 0; i < bytes.length; i++){
    crc ^= (bytes[i] << 8);
    for(let j = 0; j < 8; j++){
      if((crc & 0x8000) !== 0) crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
      else crc = (crc << 1) & 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function cleanPayloadBase(payload){
  let result = ''; let i = 0;
  while(i < payload.length - 3){
    let tag = payload.substring(i, i + 2);
    let len = parseInt(payload.substring(i + 2, i + 4), 10);
    if(isNaN(len) || i + 4 + len > payload.length){ result += payload.substring(i); break; }
    if(tag === '54' || tag === '63'){ i += 4 + len; continue; }
    result += payload.substring(i, i + 4 + len); i += 4 + len;
  }
  if(i < payload.length){ let rem = payload.substring(i); if(!rem.startsWith('6304')) result += rem; }
  return result;
}
function generateDynamicPayload(staticPayload, amount){
  let baseStr = (staticPayload || '').trim();
  if(!baseStr) return '';
  baseStr = cleanPayloadBase(baseStr);
  if(baseStr.includes('010211')) baseStr = baseStr.replace('010211', '010212');
  else if(!baseStr.includes('010212')) baseStr = '000201010212' + baseStr.substring(12);
  if(amount && Number(amount) > 0){
    let amtStr = Math.round(Number(amount)).toString();
    let lenStr = amtStr.length.toString().padStart(2, '0');
    baseStr += '54' + lenStr + amtStr;
  }
  let rawPayload = baseStr + '6304';
  return rawPayload + crc16ccitt(new TextEncoder().encode(rawPayload));
}

function campaignOf(p){ return DB.campaigns.find(c => c.id === p.campaignId && c.active) || null; }
function priceOf(p){
  const c = campaignOf(p);
  if(!c) return { price:p.price, old:null, percent:0 };
  const np = Math.round(p.price * (100 - c.percent) / 100);
  return { price:np, old:p.price, percent:c.percent };
}
function cartTotals(){
  let subtotal = 0, discount = 0, count = 0;
  state.cart.forEach(it => { const p = DB.products.find(x => x.id === it.productId); if(!p) return; const pr = priceOf(p); const base = pr.old ? pr.old : pr.price; subtotal += base * it.qty; discount += (base - pr.price) * it.qty; count += it.qty; });
  return { subtotal, discount, total: subtotal - discount, count };
}
function filterProducts(){ return DB.products.filter(p => (state.cat === 'all' || p.cat === state.cat) && p.name.toLowerCase().includes(state.q.toLowerCase())); }

  const it = state.cart.find(i => i.productId === id);
  if(it){ if(it.qty + 1 > p.stock) return toast('လက်ကျန် မလုံလောက်ပါ'); it.qty++; } else state.cart.push({ productId:id, qty:1 });
  toast('🛒 ထည့်ပြီးပါပြီ'); render();
}
function changeQty(id, d){
  const it = state.cart.find(i => i.productId === id);
  const p = DB.products.find(x => x.id === id);
  if(!it || !p) return;
  it.qty += d;
  if(it.qty <= 0) state.cart = state.cart.filter(i => i.productId !== id);
  else if(it.qty > p.stock) it.qty = p.stock;

async function handleReceiptUpload(input){
  const file = input.files[0]; if(!file) return;
  const compressed = await compressImage(file, 800, 0.7);
  uploadedReceiptData = compressed;
  const box = document.getElementById('receiptPreviewContainer');
  if(box) box.innerHTML = `<img src="${compressed}" style="max-height:140px;border-radius:10px;border:1px solid var(--line);padding:4px">`;
  const btn = document.getElementById('submitOrderBtn'); if(btn) btn.disabled = false;
}
function compressImage(file, maxW, quality){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function saveUser(userId){
  const username = document.getElementById('muUser').value.trim().toLowerCase();
  const fullname = document.getElementById('muName').value.trim();
  const phoneDigits = digitsOnly(document.getElementById('muPhone').value);
  const pass = document.getElementById('muPass').value;
  const role = document.getElementById('muRole').value;
  if(!userId && (!username || username.length < 3)){ toast('Username ၃ လုံးအနည်းဆုံး'); return; }
  if(!fullname){ toast('အမည် ထည့်ပါ'); return; }
  if(!phoneDigits || phoneDigits.length < 6 || phoneDigits.length > 11){ toast('ဖုန်း ၆-၁၁ လုံး'); return; }
  if(!userId && (!pass || pass.length < 6)){ toast('Password ၆ လုံးအနည်းဆုံး'); return; }
  if(!navigator.onLine){ toast('📶 Internet မရပါ'); return; }
  if(!userId && DB.users.find(x => (x.username||'').toLowerCase() === username)){ toast('Username သုံးပြီးသား'); return; }
  showLoading(userId ? 'Update လုပ်နေသည်...' : 'User ဖန်တီးနေသည်...');
  try {
    const fullPhone = '09' + phoneDigits;
    if(userId){
      await updateDoc(doc(db, 'users', userId), { fullname, phone: fullPhone, role });
      hideLoading(); closeModal(); toast('💾 သိမ်းပြီး');
    } else {
      const secondaryApp = initializeApp(firebaseConfig, 'CreateUser_' + Date.now());
      const secondaryAuth = getAuth(secondaryApp);
      try {
        const userCred = await createUserWithEmailAndPassword(secondaryAuth, username + EMAIL_DOMAIN, pass);
        await setDoc(doc(db, 'users', userCred.user.uid), { username, fullname, phone: fullPhone, role, status: 'active', createdAt: Date.now() });
        await signOut(secondaryAuth);
      } finally { await deleteApp(secondaryApp); }
      hideLoading(); closeModal(); toast('✅ User ဖန်တီးပြီး');
    }
  } catch(e){ hideLoading(); let msg = e.message; if(msg.includes('email-already-in-use')) msg = 'Username သုံးပြီးသား'; toast('❌ ' + msg); }
}
async function deleteUser(userId){
  const u = DB.users.find(x => x.id === userId); if(!u) return;
  if(currentUser && currentUser.uid === u.id){ toast('⛔ ကိုယ့်အကောင့်'); return; }
  if(!confirm('ဖျက်မှာ သေချာပါသလား?')) return;
  try { await deleteDoc(doc(db, 'users', userId)); toast('🗑️ ဖျက်ပြီး'); } catch(e){ toast('❌ ' + e.message); }
}
async function toggleUserStatus(userId){
  const u = DB.users.find(x => x.id === userId); if(!u) return;
  if(currentUser && currentUser.uid === u.id){ toast('⛔ ကိုယ့်အကောင့်'); return; }
  try { const newStatus = u.status === 'active' ? 'suspended' : 'active'; await updateDoc(doc(db, 'users', userId), { status: newStatus }); toast(newStatus === 'active' ? '✅ ဖွင့်ပြီး' : '⛔ ပိတ်ပြီး'); } catch(e){ toast('❌ ' + e.message); }
}
function adminUsersView(){
  const q = (state.userSearch||'').toLowerCase();
  const list = DB.users.filter(u => !q || (u.username||'').toLowerCase().includes(q) || (u.id||'').toLowerCase().includes(q) || (u.fullname||'').toLowerCase().includes(q));
  return `<div class="card"><h3>👥 အသုံးပြုသူ <span class="r">${DB.users.length}</span></h3><div class="searchbar"><input placeholder="🔍 ရှာရန်..." value="${esc(state.userSearch)}" oninput="onUserSearch(this.value)"></div><button class="btn primary" onclick="openUserModal('')">➕ User အသစ်</button><div style="height:14px"></div>${list.length ? list.map(u => { const isSelf = currentUser && currentUser.uid === u.id; const initial = (u.fullname || u.username || '?').charAt(0).toUpperCase(); const bg = u.role === 'admin' ? 'linear-gradient(135deg,#f59e0b,#ef4444)' : 'linear-gradient(135deg,#4f46e5,#06b6d4)'; return `<div class="ucard"><div class="av" style="background:${bg}">${esc(initial)}</div><div class="info"><b>${esc(u.fullname || u.username)} ${isSelf ? '(ကိုယ်)' : ''}</b><small><span class="roletag ${u.role}">${u.role === 'admin' ? '🛠️ Admin' : '👤 User'}</span>${u.status === 'suspended' ? '<span class="roletag suspended">⛔</span>' : ''}</small><small>@${esc(u.username)} • ${esc(u.phone || '')}</small></div><div class="acts"><button class="btn ghost sm" onclick="openUserModal('${u.id}')">✏️</button><button class="btn ${u.status === 'active' ? 'bad' : 'ok'} sm" onclick="toggleUserStatus('${u.id}')" ${isSelf ? 'disabled' : ''}>${u.status === 'active' ? '⛔' : '✅'}</button><button class="btn bad sm" onclick="deleteUser('${u.id}')" ${isSelf ? 'disabled' : ''}>🗑️</button></div></div>`; }).join('') : `<div class="empty">မတွေ့ပါ</div>`}</div>`;
}

/* ============ Admin Products ============ */
function adminProducts(){
  return `<div class="card"><h3>📦 ပစ္စည်း <span class="r">${DB.products.length}</span></h3><button class="btn primary" onclick="editProduct('')">➕ ပစ္စည်း အသစ်</button><div style="height:12px"></div>${DB.products.map(p => { const c = DB.campaigns.find(x => x.id === p.campaignId); return `<div class="arow"><div class="thumb">${p.icon}</div><div class="n">${esc(p.name)}<small>${esc(p.cat)} • လက်ကျန် ${p.stock} • ${mmk(p.price)} ကျပ်${c ? ' • 🎯 ' + esc(c.name) + ' (-' + c.percent + '%)' : ''}</small></div><button class="btn ghost sm" onclick="editProduct('${p.id}')">✏️</button><button class="btn bad sm" onclick="deleteProduct('${p.id}')">🗑️</button></div>`; }).join('') || `<div class="empty">ပစ္စည်း မရှိပါ</div>`}</div>`;
}
function editProduct(id){
  const p = id ? DB.products.find(x => x.id === id) : null; const isEdit = !!p;
  showModal(`<button class="close" onclick="closeModal()">✕</button><h3>${isEdit ? '✏️ ပစ္စည်း ပြင်' : '➕ ပစ္စည်း အသစ်'}</h3><div class="field"><label>အမည် <span class="req">*</span></label><input id="epName" value="${isEdit ? esc(p.name) : ''}"></div><div class="field"><label>အမျိုးအစား</label><input id="epCat" value="${isEdit ? esc(p.cat) : ''}" placeholder="စားသောက်ကုန်"></div><div class="field"><label>Icon (Emoji)</label><input id="epIcon" value="${isEdit ? esc(p.icon || '📦') : '📦'}" maxlength="6"></div><div class="field"><label>ဈေး (ကျပ်) <span class="req">*</span></label><input id="epPrice" type="number" value="${isEdit ? p.price : 0}"></div><div class="field"><label>လက်ကျန်</label><input id="epStock" type="number" value="${isEdit ? p.stock : 0}"></div><div class="field"><label>ကမ်ပိန်း</label><select id="epCampaign"><option value="">— မရှိ —</option>${DB.campaigns.map(c => `<option value="${c.id}" ${isEdit && p.campaignId === c.id ? 'selected' : ''}>${esc(c.name)} (${c.percent}%)</option>`).join('')}</select></div><button class="btn primary" onclick="saveProductEdit('${isEdit ? p.id : ''}')">💾 သိမ်း</button>`);
}
async function saveProductEdit(id){
  const name = document.getElementById('epName').value.trim(); const cat = document.getElementById('epCat').value.trim() || 'အခြား';
  const icon = document.getElementById('epIcon').value.trim() || '📦'; const price = parseInt(document.getElementById('epPrice').value, 10) || 0;
  const stock = parseInt(document.getElementById('epStock').value, 10) || 0; const campaignId = document.getElementById('epCampaign').value || null;
  if(!name){ toast('အမည် ထည့်ပါ'); return; }
  if(price <= 0){ toast('ဈေး ထည့်ပါ'); return; }
  try {
    if(id) await updateDoc(doc(db, 'products', id), { name, cat, icon, price, stock, campaignId });
    else await addDoc(collection(db, 'products'), { name, cat, icon, price, stock, campaignId, createdAt: Date.now() });
    closeModal(); toast('💾 သိမ်းပြီး');
  } catch(e){ toast('❌ ' + e.message); }
}
async function deleteProduct(id){
  const p = DB.products.find(x => x.id === id); if(!p) return;
  if(!confirm(`"${p.name}" ဖျက်မှာ သေချာပါသလား?`)) return;
  try { await deleteDoc(doc(db, 'products', id)); toast('🗑️ ဖျက်ပြီး'); } catch(e){ toast('❌ ' + e.message); }
}

/* ============ Admin Router ============ */
function viewAdmin(){
  const t = state.adminTab; const pendingCount = DB.orders.filter(o => o.status === 'pending').length;
  let body = '';
  if(t === 'pending') body = adminPending();
  else if(t === 'users') body = adminUsersView();
  else if(t === 'products') body = adminProducts();
  else if(t === 'campaigns') body = adminCampaigns();
  else if(t === 'banners') body = adminBanners();
  else if(t === 'announcements') body = adminAnnouncements();
  else if(t === 'mmqr') body = adminMMQR();
  else body = adminPending();
  return `<div class="chips" style="padding-bottom:12px">${[['pending', `🕒 အတည်ပြု ${pendingCount ? '('+pendingCount+')' : ''}`],['products','📦 ပစ္စည်း'],['campaigns','🎯 ကမ်ပိန်း'],['banners','🖼️ Banner'],['announcements','📢 အသိပေး'],['users','👥 User'],['mmqr','💰 MMQR']].map(([k,l]) => `<button class="chip ${t===k?'on':''}" onclick="setAdminTab('${k}')">${l}</button>`).join('')}</div>${body}`;
}

/* ============ Header / Tabs / Render ============ */

function renderHeader(){
  if(!currentUser) return;
  const t = cartTotals(); const isAdmin = currentUser.role === 'admin'; const showCart = state.role === 'user';

function renderTabs(){
  const el = document.getElementById('tabbar'); if(!currentUser){ el.innerHTML = ''; return; }
  if(state.role === 'admin'){
    el.className = 'scrollable'; const p = DB.orders.filter(o => o.status === 'pending').length;
    el.innerHTML = [['pending','🕒','အတည်ပြု',p],['products','📦','ပစ္စည်း',0],['campaigns','🎯','ကမ်ပိန်း',0],['banners','🖼️','Banner',0],['announcements','📢','အသိပေး',0],['users','👥','User',0],['mmqr','💰','MMQR',0]].map(([k,ic,lb,badge]) => `<button class="${state.adminTab===k?'on':''}" onclick="setAdminTab('${k}')"><span class="ic">${ic}</span>${lb}${badge ? `<span class="cnt">${badge}</span>` : ''}</button>`).join('');
  } else {
    el.className = ''; const t = cartTotals();
    el.innerHTML = [['shop','🏪','ဈေးဝယ်',0],['cart','🛒','ခြင်းတောင်း',t.count],['orders','🧾','မှတ်တမ်း',0]].map(([k,ic,lb,badge]) => `<button class="${state.view===k?'on':''}" onclick="setView('${k}')"><span class="ic">${ic}</span>${lb}${badge ? `<span class="cnt">${badge}</span>` : ''}</button>`).join('');
  }
}
function render(){
  if(!currentUser) return;
  renderHeader(); const m = document.getElementById('main');
  if(state.role === 'admin') m.innerHTML = viewAdmin();
  else { m.innerHTML = { shop: viewShop, cart: viewCart, orders: viewOrders }[state.view](); if(state.view === 'shop') renderBanners(); }
  renderTabs();
}
function viewProfile(){
  if(!currentUser) return;
  showModal(`<button class="close" onclick="closeModal()">✕</button><h3>👤 Profile</h3><div class="sumrow"><span>Username</span><b>${esc(currentUser.username)}</b></div><div class="sumrow"><span>အမည်</span><b>${esc(currentUser.fullname || '')}</b></div><div class="sumrow"><span>ဖုန်း</span><b>${esc(currentUser.phone || '')}</b></div><div class="sumrow"><span>Role</span><b>${currentUser.role === 'admin' ? '🛠️ Admin' : '👤 User'}</b></div><div style="height:14px"></div><button class="btn ghost" onclick="closeModal();showAnnouncement()">📢 အသိပေးချက်</button><div style="height:8px"></div><button class="btn bad" onclick="closeModal(); doLogout()">🚪 Logout</button>`);
}

setInterval(() => { if(currentUser && state.role === 'user' && state.view === 'shop'){ const bs = DB.banners.filter(b => b.active); if(bs.length > 1){ state.bannerIdx = (state.bannerIdx + 1) % bs.length; renderBanners(); } } }, 4500);
window.addEventListener('offline', () => { toast('📶 Internet ပြတ်သွားပါပြီ'); });

Object.assign(window, { togglePw, doLogin, doLogout, showModal, closeModal, toast, setRole, setView, setAdminTab, setCat, setBanner, onSearch, onUserSearch, addToCart, changeQty, removeItem, openPay, handleReceiptUpload, confirmPay, previewReceipt, approveOrder, rejectOrder, openBannerEdit, saveBannerEdit, toggleBanner, deleteBanner, bnLivePreview, openCampaignEdit, saveCampaignEdit, toggleCampaign, deleteCampaign, openAnnEdit, saveAnnEdit, toggleAnn, deleteAnn, previewAnn, setActiveMMQR, previewMMQR, openMMQREdit, saveMMQREdit, openUserModal, saveUser, deleteUser, toggleUserStatus, editProduct, saveProductEdit, deleteProduct, viewProfile, render });

document.getElementById('authScreen').style.display = 'flex';
showLoading('စတင်နေသည်...');

onAuthStateChanged(auth, async (user) => {
  if(user){
    authUser = user;
    try {
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if(userDoc.exists()){
        const uData = userDoc.data();
        if(uData.status === 'suspended'){ await signOut(auth); hideLoading(); document.getElementById('authScreen').style.display = 'flex'; toast('⛔ ဤအကောင့်ကို ပိတ်ထားပါသည်'); return; }
        currentUser = { uid: user.uid, ...uData };
        hideLoading(); await enterApp();
      } else { await signOut(auth); hideLoading(); document.getElementById('authScreen').style.display = 'flex'; }
    } catch(e){ hideLoading(); document.getElementById('authScreen').style.display = 'flex'; console.error(e); }
  } else {
    currentUser = null; authUser = null; hideLoading(); document.getElementById('authScreen').style.display = 'flex';
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    const as = document.getElementById('authScreen');
    if(as.style.display !== 'none'){ const el = document.activeElement; if(el && (el.id === 'liUser' || el.id === 'liPass')) doLogin(); }
  }
});
